# Initial config for SSL certificate issuance
# This is used before certificates are obtained

server {
    listen 80;
    listen [::]:80;
    server_name logam-mulia-antam.com www.logam-mulia-antam.com;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Simple response for initial setup
    location / {
        return 200 "Server is initializing. SSL certificates pending...";
        add_header Content-Type text/plain;
    }
}
