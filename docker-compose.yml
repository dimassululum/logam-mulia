version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: logam-mulia-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: antam_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logam-mulia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logam-mulia-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:5000}
      DATABASE_URL: postgresql://postgres:${DB_PASSWORD:-postgres}@db:5432/antam_db?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      DUITKU_MERCHANT_CODE: ${DUITKU_MERCHANT_CODE}
      DUITKU_API_KEY: ${DUITKU_API_KEY}
      DUITKU_IS_PRODUCTION: ${DUITKU_IS_PRODUCTION:-false}
      DUITKU_EXPIRY_MINUTES: ${DUITKU_EXPIRY_MINUTES:-1440}
      RAJAONGKIR_API_KEY: ${RAJAONGKIR_API_KEY}
      RAJAONGKIR_BASE_URL: ${RAJAONGKIR_BASE_URL:-https://rajaongkir.komerce.id/api/v1}
      RAJAONGKIR_ORIGIN_ID: ${RAJAONGKIR_ORIGIN_ID}
      RAJAONGKIR_ORIGIN_SEARCH: ${RAJAONGKIR_ORIGIN_SEARCH:-Jakarta Timur}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@logam-mulia-antam.com}
      ADMIN_ORDER_NOTIFICATION_EMAIL: ${ADMIN_ORDER_NOTIFICATION_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-https://logam-mulia-antam.com}
      FRONTEND_URLS: ${FRONTEND_URLS}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logam-mulia-network

  # Frontend Next.js
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: logam-mulia-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://logam-mulia-antam.com/api}
    depends_on:
      - backend
    networks:
      - logam-mulia-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: logam-mulia-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - backend
      - frontend
    networks:
      - logam-mulia-network
    command: '/bin/sh -c ''while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g "daemon off;"'''

  # Certbot for SSL
  certbot:
    image: certbot/certbot
    container_name: logam-mulia-certbot
    restart: unless-stopped
    volumes:
      - certbot_data:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - logam-mulia-network

volumes:
  postgres_data:
  uploads_data:
  certbot_data:
  certbot_www:

networks:
  logam-mulia-network:
    driver: bridge
