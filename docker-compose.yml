services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logam-mulia-backend
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://dhlb_root:Erlanggabimbi41@host.docker.internal:5432/logam_mulia
      FRONTEND_URL: https://logam-mulia.dhlb41.com
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      UPLOAD_DIR: ./uploads
      MAX_FILE_SIZE_MB: 5
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY:-SB-Mid-server-xxx}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:-SB-Mid-client-xxx}
      MIDTRANS_IS_PRODUCTION: false
      RAJAONGKIR_API_KEY: ${RAJAONGKIR_API_KEY:-xxx}
      RAJAONGKIR_BASE_URL: https://api.rajaongkir.com/starter
      RESEND_API_KEY: ${RESEND_API_KEY:-re_xxx}
      EMAIL_FROM: noreply@logam-mulia.dhlb41.com
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./backend/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ── Frontend Next.js ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://logam-mulia.dhlb41.com/api
        NEXT_PUBLIC_APP_URL: https://logam-mulia.dhlb41.com
    container_name: logam-mulia-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      backend:
        condition: service_healthy

  # ── Cloudflare Tunnel ────────────────────────────────────────────────────────
  cloudflare-tunnel:
    image: cloudflare/cloudflared:latest
    container_name: logam-mulia-tunnel
    restart: unless-stopped
    network_mode: host
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
