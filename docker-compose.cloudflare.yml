version: '3.8'

# =============================================================================
# Docker Compose for Cloudflare Tunnel Deployment
# =============================================================================
# This setup uses Cloudflare Tunnel instead of Nginx + Certbot
# Benefits:
#   - No need to open ports 80/443
#   - Automatic SSL (Cloudflare handled)
#   - DDoS protection included
#   - Global CDN included
#   - 100% FREE
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  db:
    image: postgres:15-alpine
    container_name: logam-mulia-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: antam_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - logam-mulia-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===========================================================================
  # Backend API (Node.js/Express)
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: logam-mulia-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://logam-mulia.dhlb41.com/api}
      DATABASE_URL: ${DATABASE_URL}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      MIDTRANS_SERVER_KEY: ${MIDTRANS_SERVER_KEY}
      MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY}
      MIDTRANS_IS_PRODUCTION: ${MIDTRANS_IS_PRODUCTION:-false}
      DUITKU_MERCHANT_CODE: ${DUITKU_MERCHANT_CODE}
      DUITKU_API_KEY: ${DUITKU_API_KEY}
      DUITKU_IS_PRODUCTION: ${DUITKU_IS_PRODUCTION:-false}
      DUITKU_EXPIRY_MINUTES: ${DUITKU_EXPIRY_MINUTES:-1440}
      RAJAONGKIR_API_KEY: ${RAJAONGKIR_API_KEY}
      RAJAONGKIR_BASE_URL: ${RAJAONGKIR_BASE_URL:-https://rajaongkir.komerce.id/api/v1}
      RAJAONGKIR_ORIGIN_ID: ${RAJAONGKIR_ORIGIN_ID}
      RAJAONGKIR_ORIGIN_SEARCH: ${RAJAONGKIR_ORIGIN_SEARCH:-Jakarta Timur}
      RESEND_API_KEY: ${RESEND_API_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@logam-mulia-antam.com}
      ADMIN_ORDER_NOTIFICATION_EMAIL: ${ADMIN_ORDER_NOTIFICATION_EMAIL}
      FRONTEND_URL: ${FRONTEND_URL:-https://logam-mulia-antam.com}
      FRONTEND_URLS: ${FRONTEND_URLS}
      UPLOAD_DIR: /app/uploads
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-10}
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    networks:
      - logam-mulia-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Frontend Next.js
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://logam-mulia.dhlb41.com/api}
        INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://backend:5000}
    container_name: logam-mulia-frontend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://logam-mulia.dhlb41.com/api}
      INTERNAL_API_ORIGIN: ${INTERNAL_API_ORIGIN:-http://backend:5000}
    ports:
      - "127.0.0.1:4000:3000"
    depends_on:
      - backend
    networks:
      - logam-mulia-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ===========================================================================
  # Cloudflare Tunnel (REPLACES Nginx + Certbot)
  # ===========================================================================
  # This connects your local services to Cloudflare's edge network
  # Public traffic flows: User -> Cloudflare Edge -> Tunnel -> Your Services
  # ===========================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: logam-mulia-antam-tunnel
    restart: always
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - logam-mulia-network
    # Cloudflare Tunnel creates outbound connection, no ports needed!
    # This is the magic - your server can be behind any firewall/NAT

# =============================================================================
# Volumes
# =============================================================================
volumes:
  postgres_data:
    driver: local
  uploads_data:
    driver: local

# =============================================================================
# Networks
# =============================================================================
networks:
  logam-mulia-network:
    driver: bridge
