services:
  backend:
    ports:
      - "${BACKEND_BIND_ADDR:-127.0.0.1}:${BACKEND_HOST_PORT:-5100}:5000"

  frontend:
    ports:
      - "${FRONTEND_BIND_ADDR:-127.0.0.1}:${FRONTEND_HOST_PORT:-4100}:3000"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate --protocol http2 --config /etc/cloudflared/config.yml run
    volumes:
      - type: bind
        source: ${CLOUDFLARED_CONFIG_FILE:-./cloudflared/config.staging.yml}
        target: /etc/cloudflared/config.yml
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CLOUDFLARED_CREDENTIALS_FILE:-./cloudflared/staging-credentials.json}
        target: /etc/cloudflared/credentials.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - logam-mulia-network
